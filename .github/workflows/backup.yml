name: Encrypted clinical backup

# Runs daily. Also runnable by hand from the Actions tab, which is how you
# should test it the first time.
on:
  schedule:
    - cron: '30 2 * * *'   # 02:30 UTC daily
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone

      - name: Configure storage destination
        run: |
          mkdir -p ~/.config/rclone
          # Whole rclone.conf as one secret. Works with a normal Google login
          # (no service account key needed, so org policies blocking key
          # creation are not an obstacle), and equally with B2, Dropbox,
          # OneDrive or anything else rclone supports.
          printf '%s' '${{ secrets.RCLONE_CONFIG }}' > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Run backup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          RCLONE_REMOTE: ${{ secrets.RCLONE_REMOTE }}
          RETAIN_DAYS: '90'
        run: |
          chmod +x backup/backup.sh
          ./backup/backup.sh

      - name: Verify the backup we just made can be decrypted and is intact
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          chmod +x backup/restore.sh
          archive=$(ls -t backups/*.gpg | head -1)
          ./backup/restore.sh "$archive" --verify

      # Nothing unencrypted, and no credentials, should outlive the job
      - name: Shred local copies
        if: always()
        run: |
          shred -u backups/*.gpg 2>/dev/null || rm -f backups/*.gpg
          shred -u ~/.config/rclone/rclone.conf 2>/dev/null || rm -f ~/.config/rclone/rclone.conf
